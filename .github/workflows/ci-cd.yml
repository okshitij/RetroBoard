name: RetroBoard CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: TypeScript type check
              run: npx tsc --noEmit

            - name: Lint with ESLint
              run: npm run lint

            - name: Run unit tests
              run: npm run test
  
